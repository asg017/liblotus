[workspace]
resolver = "2"
members = [
    "crates/lotus-core",
    "crates/lotus-datetime",
    "crates/lotus-numbat",
    "crates/lotus-url",
    "crates/lotus-pyo3",
    "crates/lotus-wasm",
    "examples/lotus-text",
    "examples/lotus-units-tui",
]

[workspace.package]
edition = "2021"
version = "0.0.1-alpha.1"

[workspace.dependencies]
# Internal crates
lotus-core = { path = "crates/lotus-core" }
lotus-datetime = { path = "crates/lotus-datetime", default-features = false }
lotus-numbat = { path = "crates/lotus-numbat" }
lotus-url = { path = "crates/lotus-url" }

# Third-party — shared across multiple crates
rusqlite = { version = "0.34", features = ["bundled", "session"] }
fallible-streaming-iterator = "0.1"
ratatui = "0.29"
crossterm = "0.28"

# Third-party — used by lotus-core. Kept minimal; new entries need a justified
# bundle-size + supply-chain rationale (see crates/lotus-core/CLAUDE.md).
indexmap = "2"
thiserror = "2"

# Third-party — single-crate users (kept here so all version pins live in one place)
pyo3 = { version = "0.25", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
send_wrapper = "0.6"
rustyline = "14"
clap = { version = "4", features = ["derive"] }
arboard = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Default clippy is already clean; this section is the place to opt into
# stricter groups (e.g. clippy::pedantic) when we want to.
